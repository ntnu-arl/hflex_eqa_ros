---
launch:
  - arg:
      name: use_floorplan_prior
      default: 'true'
      description: Whether to include the floorplan prior in the VLM prompt
  - arg:
      name: eqa_planner_system_prompt_file_name
      default: $(if $(var use_floorplan_prior) eqa_planner_with_floorplan_system_prompt.txt eqa_planner_system_prompt.txt)
  - arg:
      name: use_choices
      default: 'false'
  - arg:
      name: choices
      default: '[]'
      description: list of choices for the question, if applicable
  # Configuration files
  - arg:
      name: config_path_hlp
      default: $(find-pkg-share hvlm_planner)/config/habitat/high_level.yaml
      description: Path to the high-level planner configuration file
  - arg:
      name: ros_config_path_hlp
      default: $(find-pkg-share hvlm_planner_ros)/config/habitat/high_level.yaml
      description: Path to the ROS node configuration file
  - arg:
      name: planner_vlm_prompt_path
      default: $(find-pkg-share hvlm_planner)/config/habitat/planner_system_prompt.txt
      description: Path to the system prompt for the VLM planner
  - arg:
      name: eqa_prompt_path
      default: $(find-pkg-share hvlm_planner)/config/habitat/$(var eqa_planner_system_prompt_file_name)
      description: Path to the system prompt for the EQA VLM planner
  - arg:
      name: room_classification_prompt_path
      default: $(find-pkg-share vlms_ros)/config/room_classification/system_prompt.txt
      description: Path to the system prompt for the room classification VLM
  # Question
  - arg:
      name: question
      default: ''
      description: Optional question to override the one in the question file
  # Floorplan graph
  - arg:
      name: floorplan_nodes
      default: '[]'
      description: JSON list of nodes in the floorplan graph
  - arg:
      name: floorplan_edges
      default: '[]'
      description: JSON list of edges in the floorplan graph, where each edge is a list of two nodes
  - arg:
      name: floorplan_source
      default: list
      description: Floorplan source to use. Set to 'list' for floorplan_nodes/floorplan_edges or 'json' for floorplan_json_path.
  - arg:
      name: floorplan_json_path
      default: ''
      description: Path to a JSON file containing floorplan graph nodes and edges
  # Topics
  - arg:
      name: dsg_topic_hlp
      default: /hvlm_planner/search_manager/dsg
      description: Topic to subscribe for DSG updates
  - arg:
      name: image_topic
      default: /hydra/backend/image
      description: Topic to subscribe for image updates
  - arg:
      name: objects_views_topic
      default: /hvlm_planner/search_manager/objects_views
      description: Topic to subscribe for objects views updates
  - arg:
      name: question_topic
      default: /hydra/question
      description: Topic to subscribe for user questions
  - arg:
      name: task_parsing_output_topic
      default: /task_parsing/output
      description: Topic to subscribe for task parsing outputs from the TaskParser module
  - include:
      file: $(find-pkg-share hvlm_planner_ros)/launch/high_level.launch.yaml
      arg:
        - {name: config_path, value: $(var config_path_hlp)}
        - {name: ros_config_path, value: $(var ros_config_path_hlp)}
        - {name: planner_vlm_prompt_path, value: $(var planner_vlm_prompt_path)}
        - {name: eqa_prompt_path, value: $(var eqa_prompt_path)}
        - {name: room_classification_prompt_path, value: $(var room_classification_prompt_path)}
        - {name: question, value: $(var question)}
        - {name: dsg_topic, value: $(var dsg_topic_hlp)}
        - {name: image_topic, value: $(var image_topic)}
        - {name: objects_views_topic, value: $(var objects_views_topic)}
        - {name: question_topic, value: $(var question_topic)}
        - {name: task_parsing_output_topic, value: $(var task_parsing_output_topic)}
        - {name: floorplan_nodes, value: $(var floorplan_nodes)}
        - {name: floorplan_edges, value: $(var floorplan_edges)}
        - {name: floorplan_source, value: $(var floorplan_source)}
        - {name: floorplan_json_path, value: $(var floorplan_json_path)}
        - {name: use_floorplan_prior, value: $(var use_floorplan_prior)}
        - {name: choices, value: $(var choices)}
        - {name: use_choices, value: $(var use_choices)}
