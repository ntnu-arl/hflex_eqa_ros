---
launch:
  - arg: {name: question, default: '', description: Optional question override}
  - arg: {name: log_folder, default: /developer/results, description: Planner output directory}
  - arg: {name: question_topic, default: /eqa_question}
  - arg: {name: choices_topic, default: /eqa_choices}
  - arg: {name: floorplan_nodes, default: '[]'}
  - arg: {name: floorplan_edges, default: '[]'}
  - arg: {name: floorplan_source, default: json, description: Select json or list input}
  - arg:
      name: floorplan_json_path
      default: $(find-pkg-share hflex_eqa_ros)/config/anymal/eqa_floorplan.json
      description: Topological floorplan JSON; replace the example for a new building
  - arg: {name: use_floorplan_prior, default: 'true'}
  - include:
      file: $(find-pkg-share hflex_eqa_ros)/launch/anymal/anymal_high_level.launch.yaml
      arg:
        - {name: question_topic, value: $(var question_topic)}
        - {name: choices_topic, value: $(var choices_topic)}
        - {name: question, value: $(var question)}
        - {name: floorplan_nodes, value: $(var floorplan_nodes)}
        - {name: floorplan_edges, value: $(var floorplan_edges)}
        - {name: floorplan_source, value: $(var floorplan_source)}
        - {name: floorplan_json_path, value: $(var floorplan_json_path)}
        - {name: use_floorplan_prior, value: $(var use_floorplan_prior)}
        - {name: log_folder, value: $(var log_folder)}
  - include:
      file: $(find-pkg-share hflex_eqa_ros)/launch/anymal/anymal_search_manager.launch.yaml
      arg:
        - {name: question_topic, value: $(var question_topic)}
        - {name: question, value: $(var question)}
  - group:
      - set_remap: {from: new_labels, to: /hydra/labels/new_labels}
      - include:
          file: $(find-pkg-share vlms_ros)/launch/task_parsing.launch.yaml
